# 默认配置示例文件, 此文件由单元测试生成, 请勿直接修改
# 复制此文件为 config.yaml 并根据需要修改

# 服务端配置
server:
  debug: false # 启用调试日志和诊断信息

  # HTTP 服务配置
  http:
    listen: ":23108" # HTTP 服务监听地址

    # HTTPS TLS 配置
    tls:
      enabled: false # 是否在调用方中启用 TLS 证书热重载

      # TLS 证书来源列表
      certificates:
        - id: "default" # 证书的稳定标识
          certificate: "${APP_DATA:-.local/data}/ssl/fullchain.pem" # TLS 证书路径或 URI
          private-key: "${APP_DATA:-.local/data}/ssl/privkey.pem" # TLS 私钥路径或 URI
      default-certificate: "default" # 未匹配 SNI 时使用的证书 ID
      poll-interval: 5m0s # 证书来源兜底轮询间隔
      retry-interval: 2s # 证书重载失败后的重试间隔
      poll-jitter-ratio: 0.1 # 成功轮询后的向下随机抖动比例
      allow-insecure-http: false # 允许通过明文 HTTP 读取证书材料
    read-header-timeout: 10s # HTTP 请求头读取超时
    read-timeout: 0s # HTTP 请求读取超时；0 表示不限制，适合流式入口
    write-timeout: 0s # HTTP 响应写入超时；0 表示不限制，适合长流式响应
    idle-timeout: 1m0s # HTTP 空闲连接超时时间
    shutdown-timeout: 15s # 优雅关闭并等待流式请求完成的最长时间
    enable-debug-requests: true # 调试级别记录请求元数据，不记录 body 和敏感头

  # Console PostgreSQL 数据库配置
  database:
    host: "${PGHOST}" # PostgreSQL 主机
    port: "${PGPORT}" # PostgreSQL 端口
    user: "${PGUSER}" # PostgreSQL 用户名
    database: "${PGDATABASE}" # PostgreSQL 数据库名
    password: "${PGPASSWORD}" # PostgreSQL 密码
    max-open-conns: 32 # PostgreSQL 最大连接数
    max-idle-conns: 16 # PostgreSQL 最大空闲连接数

  # Directive Proxy 数据面配置
  relay:
    base-url: "${DIRECTIVE_PROXY_BASE_URL:-http://localhost:23198}" # Directive Proxy HTTP 基址
    directive-token: "${DIRECTIVE_REMOTE_TOKEN:?fixed dp.22.remote token is required}" # 固定 dp.22.remote Token，仅在 Entry 到 Directive Proxy 之间使用
    max-idle-conns: 4096 # 下游全局空闲连接池容量
    max-idle-conns-per-host: 2048 # 下游单主机空闲连接池容量
    max-conns-per-host: 0 # 下游单主机活跃连接上限；0 表示不限制
    idle-conn-timeout: 1m0s # 下游空闲连接保留时间
    disable-keep-alives: false # 是否禁用下游 keep-alive
